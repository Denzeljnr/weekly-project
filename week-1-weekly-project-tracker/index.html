<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  :root{
    --bg:#1C1A17;
    --panel:#24211C;
    --panel-2:#2C2822;
    --panel-3:#35302A;
    --line:rgba(230,222,206,0.08);
    --line-strong:rgba(230,222,206,0.15);
    --ink:#EDE7DB;
    --ink-dim:#A79C8A;
    --ink-faint:#726858;
    --copper:#C9A063;
    --copper-soft:rgba(201,160,99,0.15);
    --signal:#8FA5B0;
    --signal-soft:rgba(143,165,176,0.15);
    --trace:#94A47E;
    --trace-soft:rgba(148,164,126,0.15);
    --danger:#BC6E5C;
    --radius:6px;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 500px at 15% -8%, rgba(95,168,211,0.06), transparent),
      radial-gradient(900px 500px at 100% 0%, rgba(214,138,92,0.05), transparent),
      var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    padding:40px 24px 80px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--signal-soft);}
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:840px;margin:0 auto;}

  /* ---------- header / title block ---------- */
  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    gap:20px;flex-wrap:wrap;
    padding-bottom:20px;margin-bottom:20px;
    border-bottom:1px solid var(--line-strong);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand svg{flex-shrink:0;}
  .brand h1{
    font-family:'Fraunces',serif;
    font-size:21px;font-weight:600;margin:0;letter-spacing:-0.01em;
  }
  .brand p{
    margin:2px 0 0;font-size:12.5px;color:var(--ink-dim);
  }
  .metafields{display:flex;gap:22px;flex-wrap:wrap;}
  .metafields .f{text-align:left;}
  .metafields .k{
    font-size:9.5px;letter-spacing:0.09em;color:var(--ink-faint);
    text-transform:uppercase;margin-bottom:3px;
  }
  .metafields .v{font-size:13px;font-weight:600;font-family:'JetBrains Mono',monospace;}

  /* ---------- stats ---------- */
  .stats{
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
    margin-bottom:32px;
  }
  .stat{
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 16px;
  }
  .stat .n{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;line-height:1;}
  .stat .l{font-size:11px;color:var(--ink-dim);margin-top:6px;}
  .stat.idea .n{color:var(--copper);}
  .stat.building .n{color:var(--signal);}
  .stat.shipped .n{color:var(--trace);}

  /* ---------- section labels ---------- */
  .section-label{
    display:flex;align-items:center;gap:10px;margin:0 0 14px;
  }
  .section-label span{
    font-family:'JetBrains Mono',monospace;font-size:11px;
    letter-spacing:0.1em;color:var(--ink-faint);text-transform:uppercase;
  }
  .section-label::after{content:'';flex:1;height:1px;background:var(--line);}

  /* ---------- new entry card ---------- */
  .newcard{
    background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:20px 22px;margin-bottom:40px;
    box-shadow:var(--shadow);
  }
  .status-msg{
    font-family:'JetBrains Mono',monospace;font-size:12px;
    margin-bottom:14px;padding:8px 12px;border-radius:4px;
    background:var(--panel-2);display:none;
  }
  .grid2{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-bottom:12px;}
  .grid1{margin-bottom:12px;}
  label{
    display:block;font-size:11px;color:var(--ink-dim);
    margin-bottom:6px;letter-spacing:0.01em;
  }
  input[type=text],select,textarea{
    width:100%;background:var(--panel-2);
    border:1px solid var(--line-strong);color:var(--ink);
    padding:10px 12px;font-family:'Space Grotesk',sans-serif;
    font-size:13.5px;border-radius:5px;transition:border-color .15s;
  }
  input[type=text]:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--signal);
  }
  textarea{resize:vertical;min-height:60px;}
  input[type=file]{
    width:100%;font-size:12.5px;color:var(--ink-dim);
    padding:9px 4px;
  }
  input[type=file]::file-selector-button{
    font-family:'JetBrains Mono',monospace;font-size:11px;
    background:var(--panel-3);color:var(--ink);
    border:1px solid var(--line-strong);border-radius:4px;
    padding:6px 12px;margin-right:10px;cursor:pointer;
  }
  .skiplist{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;
    color:var(--danger);margin-top:6px;line-height:1.5;
  }

  .btn{
    font-family:'JetBrains Mono',monospace;font-size:12px;
    letter-spacing:0.02em;background:var(--panel-2);
    border:1px solid var(--line-strong);color:var(--ink);
    padding:9px 16px;border-radius:5px;cursor:pointer;transition:all .15s;
  }
  .btn:hover{border-color:var(--signal);color:var(--signal);}
  .btn.primary{
    background:var(--copper);color:#241408;border-color:var(--copper);font-weight:600;
  }
  .btn.primary:hover{opacity:0.88;color:#241408;}
  .btn.small{padding:6px 11px;font-size:11px;}
  .btn.danger:hover{border-color:var(--danger);color:var(--danger);}

  /* ---------- filter bar ---------- */
  .filterbar{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;align-items:center;}
  .filterbar input[type=text]{flex:1;min-width:180px;}
  .chip{
    font-family:'JetBrains Mono',monospace;font-size:11px;padding:7px 14px;
    border:1px solid var(--line-strong);color:var(--ink-dim);cursor:pointer;
    border-radius:20px;transition:all .15s;white-space:nowrap;
  }
  .chip.active{border-color:var(--signal);color:var(--signal);background:var(--signal-soft);}

  /* ---------- signal-trace timeline (signature element) ---------- */
  .timeline{position:relative;padding-left:26px;}
  .timeline::before{
    content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;
    background:linear-gradient(var(--line-strong), var(--line-strong)) repeat-y;
    background-size:2px 6px;
    opacity:0.6;
  }
  .entry{position:relative;margin-bottom:16px;}
  .entry .via{
    position:absolute;left:-26px;top:22px;width:14px;height:14px;
    border-radius:50%;border:3px solid var(--bg);
    box-shadow:0 0 0 1px var(--line-strong);
  }
  .entry.idea .via{background:var(--copper);box-shadow:0 0 0 1px var(--copper), 0 0 10px rgba(214,138,92,0.4);}
  .entry.building .via{background:var(--signal);box-shadow:0 0 0 1px var(--signal), 0 0 10px rgba(95,168,211,0.45);}
  .entry.shipped .via{background:var(--trace);box-shadow:0 0 0 1px var(--trace), 0 0 10px rgba(87,184,137,0.4);}

  .card{
    background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:16px 18px;
  }
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .card-head h3{font-size:15.5px;font-weight:600;margin:0 0 4px;letter-spacing:-0.005em;}
  .meta{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);
  }
  .badge{
    font-family:'JetBrains Mono',monospace;font-size:10px;padding:4px 10px;
    letter-spacing:0.06em;text-transform:uppercase;border-radius:20px;white-space:nowrap;
    font-weight:600;
  }
  .badge.idea{background:var(--copper-soft);color:var(--copper);}
  .badge.building{background:var(--signal-soft);color:var(--signal);}
  .badge.shipped{background:var(--trace-soft);color:var(--trace);}
  .desc{font-size:13.5px;color:var(--ink);margin:10px 0 8px;line-height:1.6;}
  .learn{font-size:12.5px;color:var(--ink-dim);line-height:1.55;margin:0 0 12px;}
  .learn b{color:var(--ink);font-weight:600;}
  .stacktags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .stacktag{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-dim);
    border:1px solid var(--line-strong);padding:3px 9px;border-radius:4px;
  }
  .card-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;}
  .card-actions select{width:auto;padding:6px 9px;font-size:11px;font-family:'JetBrains Mono',monospace;}
  .file-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .file-row input[type=file]{flex:1;min-width:160px;font-size:11.5px;padding:6px 4px;}
  .github-flag{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--trace);
    display:flex;align-items:center;gap:5px;
  }
  .linkedin-box{
    margin-top:10px;width:100%;min-height:120px;
    font-family:'Space Grotesk',sans-serif;font-size:13px;
    background:var(--panel-2);border:1px solid var(--line-strong);
    border-radius:5px;padding:12px;color:var(--ink);line-height:1.55;
  }

  .empty{
    text-align:center;padding:44px 20px;color:var(--ink-faint);
    font-family:'JetBrains Mono',monospace;font-size:12.5px;
    border:1px dashed var(--line-strong);border-radius:8px;
  }
  footer{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:32px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;
  }

  @media (max-width:640px){
    .grid2{grid-template-columns:1fr;}
    .stats{grid-template-columns:repeat(2,1fr);}
    header{flex-direction:column;align-items:flex-start;}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <circle cx="15" cy="15" r="2.5" fill="#C9A063"/>
        <circle cx="4" cy="6" r="2" fill="#8FA5B0"/>
        <circle cx="26" cy="6" r="2" fill="#94A47E"/>
        <circle cx="4" cy="24" r="2" fill="#94A47E"/>
        <circle cx="26" cy="24" r="2" fill="#C9A063"/>
        <path d="M4 6H15M26 6H15M4 24H15M26 24H15M15 15V6M15 15V24" stroke="#4A4438" stroke-width="1.4"/>
      </svg>
      <div>
        <h1>Build Log</h1>
        <p>Weekly AI automation builds — self-hosted, pushed to GitHub</p>
      </div>
    </div>
    <div class="metafields">
      <div class="f"><div class="k">Engineer</div><div class="v">Nwokocha J.C.</div></div>
      <div class="f"><div class="k">Cadence</div><div class="v">1 / week</div></div>
      <div class="f"><div class="k">Sheet</div><div class="v mono" id="sheetNo">—</div></div>
      <div class="f"><div class="k">Rev.</div><div class="v mono" id="lastUpdated">—</div></div>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="section-label"><span>Log new entry</span></div>
  <div class="newcard">
    <div class="status-msg" id="formMsg"></div>
    <div class="grid2">
      <div>
        <label>Project title</label>
        <input type="text" id="f-title" placeholder="e.g. Self-hosted invoice extraction pipeline">
      </div>
      <div>
        <label>Week label</label>
        <input type="text" id="f-week" placeholder="Week 1">
      </div>
      <div>
        <label>Status</label>
        <select id="f-status">
          <option value="idea">Idea</option>
          <option value="building">Building</option>
          <option value="shipped">Shipped</option>
        </select>
      </div>
    </div>
    <div class="grid1">
      <label>Stack (comma separated)</label>
      <input type="text" id="f-stack" placeholder="n8n, Gemini, Docker, Supabase">
    </div>
    <div class="grid1">
      <label>What it does</label>
      <textarea id="f-desc" placeholder="Short description of the build"></textarea>
    </div>
    <div class="grid1">
      <label>What you learned / notes</label>
      <textarea id="f-learn" placeholder="Concepts, gotchas, things to revisit"></textarea>
    </div>
    <div class="grid1">
      <label>Project folder — select the root, .env / node_modules / .git are auto-skipped</label>
      <input type="file" id="f-files" webkitdirectory directory multiple>
      <div class="skiplist" id="f-skiplist"></div>
    </div>
    <button class="btn primary" id="addBtn">Add to log</button>
  </div>

  <div class="section-label"><span>Archive</span></div>
  <div class="filterbar">
    <input type="text" id="search" placeholder="Search by title, stack, or notes">
    <span class="chip active" data-filter="all">All</span>
    <span class="chip" data-filter="idea">Idea</span>
    <span class="chip" data-filter="building">Building</span>
    <span class="chip" data-filter="shipped">Shipped</span>
  </div>

  <div id="listWrap">
    <div class="empty">Loading log…</div>
  </div>

  <footer>
    <span id="footerCount">—</span>
    <span class="btn small danger" id="resetBtn" style="cursor:pointer;">Reset log</span>
  </footer>

</div>

<script>
let entries = [];
let activeFilter = 'all';

/* ---------- folder filtering ---------- */

const EXCLUDE_PATTERNS = [
  /(^|\/)\.env(\..*)?$/,
  /(^|\/)node_modules\//,
  /(^|\/)\.git\//,
  /(^|\/)\.DS_Store$/,
  /(^|\/)uploads\//,
  /(^|\/)data\.json$/,
  /(^|\/)\.gitignore$/
];

function filterFiles(fileList) {
  return [...fileList].filter(f => {
    const relPath = f.webkitRelativePath || f.name;
    return !EXCLUDE_PATTERNS.some(pattern => pattern.test(relPath));
  });
}

/* ---------- API calls ---------- */

async function loadEntries() {
  const res = await fetch('/api/entries');
  return res.json();
}

async function addEntry(data) {
  const res = await fetch('/api/entries', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  return res.json();
}

async function patchEntry(id, data) {
  const res = await fetch(`/api/entries/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  return res.json();
}

async function deleteEntryRequest(id) {
  const res = await fetch(`/api/entries/${id}`, { method: 'DELETE' });
  return res.json();
}

async function uploadFiles(entryId, fileList) {
  const filtered = filterFiles(fileList);
  const form = new FormData();
  filtered.forEach(f => form.append('files', f, f.webkitRelativePath || f.name));
  const res = await fetch(`/api/entries/${entryId}/upload`, { method: 'POST', body: form });
  const json = await res.json();
  return { ...json, skipped: [...fileList].length - filtered.length, kept: filtered.length };
}

async function pushToGithub(entryId) {
  const res = await fetch(`/api/entries/${entryId}/push`, { method: 'POST' });
  return res.json();
}

async function generateLinkedinPost(entryId) {
  const res = await fetch(`/api/entries/${entryId}/linkedin-post`, { method: 'POST' });
  return res.json();
}

/* ---------- rendering ---------- */

function showFormMsg(msg, isError) {
  const el = document.getElementById('formMsg');
  el.style.display = 'block';
  el.textContent = msg;
  el.style.color = isError ? 'var(--danger)' : 'var(--trace)';
  setTimeout(() => { el.style.display = 'none'; }, 3500);
}

function nextWeekNumber() {
  const nums = entries.filter(e => /^Week\s+(\d+)/i.test(e.week || ''))
    .map(e => parseInt(e.week.match(/\d+/)[0], 10));
  return nums.length ? Math.max(...nums) + 1 : 1;
}

function renderStats() {
  const total = entries.length;
  const ideas = entries.filter(e => e.status === 'idea').length;
  const building = entries.filter(e => e.status === 'building').length;
  const shipped = entries.filter(e => e.status === 'shipped').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${total}</div><div class="l">Total logged</div></div>
    <div class="stat idea"><div class="n">${ideas}</div><div class="l">Ideas queued</div></div>
    <div class="stat building"><div class="n">${building}</div><div class="l">In progress</div></div>
    <div class="stat shipped"><div class="n">${shipped}</div><div class="l">Shipped</div></div>
  `;
  document.getElementById('sheetNo').textContent = String(total).padStart(3, '0');
  document.getElementById('lastUpdated').textContent = new Date().toLocaleDateString();
}

function matchesFilter(e) {
  if (activeFilter !== 'all' && e.status !== activeFilter) return false;
  const q = document.getElementById('search').value.trim().toLowerCase();
  if (!q) return true;
  const hay = (e.title + ' ' + (e.stack || []).join(' ') + ' ' + (e.desc || '') + ' ' + (e.learn || '')).toLowerCase();
  return hay.includes(q);
}

function render() {
  renderStats();
  const wrap = document.getElementById('listWrap');
  const visible = entries.filter(matchesFilter)
    .slice()
    .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));

  document.getElementById('footerCount').textContent = `${visible.length} of ${entries.length} entries shown`;

  if (visible.length === 0) {
    wrap.innerHTML = '<div class="empty">No entries match. Log your first build above.</div>';
    return;
  }

  wrap.innerHTML = '<div class="timeline">' + visible.map(e => `
    <div class="entry ${e.status}">
      <div class="via"></div>
      <div class="card">
        <div class="card-head">
          <div>
            <h3>${escapeHtml(e.title)}</h3>
            <div class="meta">${escapeHtml(e.week || '')}</div>
          </div>
          <span class="badge ${e.status}">${e.status}</span>
        </div>
        ${e.desc ? `<p class="desc">${escapeHtml(e.desc)}</p>` : ''}
        ${(e.stack && e.stack.length) ? `<div class="stacktags">${e.stack.map(s => `<span class="stacktag">${escapeHtml(s)}</span>`).join('')}</div>` : ''}
        ${e.learn ? `<p class="learn"><b>Learned:</b> ${escapeHtml(e.learn)}</p>` : ''}
        <div class="card-actions">
          <select onchange="updateStatus('${e.id}', this.value)">
            <option value="idea" ${e.status === 'idea' ? 'selected' : ''}>Idea</option>
            <option value="building" ${e.status === 'building' ? 'selected' : ''}>Building</option>
            <option value="shipped" ${e.status === 'shipped' ? 'selected' : ''}>Shipped</option>
          </select>
          <span class="btn small" onclick="handlePush('${e.id}')" style="cursor:pointer;">Push to GitHub</span>
          <span class="btn small" onclick="handleLinkedin('${e.id}')" style="cursor:pointer;">Generate LinkedIn post</span>
          <span class="btn small danger" onclick="deleteEntry('${e.id}')" style="cursor:pointer;">Delete</span>
          ${e.pushedToGithub ? '<span class="github-flag">● pushed</span>' : ''}
        </div>
        <div class="file-row">
          <input type="file" id="upload-${e.id}" webkitdirectory directory multiple>
          <span class="btn small" onclick="handleUpload('${e.id}')" style="cursor:pointer;">Upload files</span>
        </div>
        <div class="skiplist" id="skiplist-${e.id}"></div>
        ${e.linkedinPost ? `<textarea class="linkedin-box" readonly>${escapeHtml(e.linkedinPost)}</textarea>` : ''}
      </div>
    </div>
  `).join('') + '</div>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------- actions ---------- */

async function refresh() {
  entries = await loadEntries();
  render();
}

async function updateStatus(id, status) {
  await patchEntry(id, { status });
  await refresh();
}

async function deleteEntry(id) {
  if (!confirm('Remove this entry from the log?')) return;
  await deleteEntryRequest(id);
  await refresh();
}

async function handleUpload(id) {
  const input = document.getElementById(`upload-${id}`);
  if (!input.files.length) { showFormMsg('Choose a folder first.', true); return; }
  const result = await uploadFiles(id, input.files);
  showFormMsg(`Uploaded ${result.kept} file(s), skipped ${result.skipped}.`, false);
}

async function handlePush(id) {
  showFormMsg('Pushing to GitHub…', false);
  const result = await pushToGithub(id);
  if (result.error) { showFormMsg(`Push failed: ${result.error}`, true); return; }
  showFormMsg(`Pushed ${result.filesPushed} file(s) to ${result.folder}.`, false);
  await refresh();
}

async function handleLinkedin(id) {
  showFormMsg('Drafting LinkedIn post…', false);
  const result = await generateLinkedinPost(id);
  if (result.error) { showFormMsg(`Generation failed: ${result.error}`, true); return; }
  showFormMsg('Draft ready — review before posting.', false);
  await refresh();
}

document.getElementById('f-files').addEventListener('change', (e) => {
  const all = [...e.target.files];
  const kept = filterFiles(all);
  const skipped = all.filter(f => !kept.includes(f));
  const el = document.getElementById('f-skiplist');
  el.textContent = skipped.length ? `Skipping ${skipped.length}: ${skipped.map(f => f.webkitRelativePath).join(', ')}` : '';
});

document.getElementById('addBtn').addEventListener('click', async () => {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { showFormMsg('Give the project a title first.', true); return; }
  const stackRaw = document.getElementById('f-stack').value.trim();
  const data = {
    title,
    week: document.getElementById('f-week').value.trim() || ('Week ' + nextWeekNumber()),
    status: document.getElementById('f-status').value,
    stack: stackRaw ? stackRaw.split(',').map(s => s.trim()).filter(Boolean) : [],
    desc: document.getElementById('f-desc').value.trim(),
    learn: document.getElementById('f-learn').value.trim()
  };
  const created = await addEntry(data);

  const files = document.getElementById('f-files').files;
  if (files.length) {
    await uploadFiles(created.id, files);
  }

  ['f-title', 'f-week', 'f-stack', 'f-desc', 'f-learn', 'f-files'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-status').value = 'idea';
  document.getElementById('f-skiplist').textContent = '';
  showFormMsg('Logged to the archive.', false);
  await refresh();
});

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.filter;
    render();
  });
});
document.getElementById('search').addEventListener('input', render);

document.getElementById('resetBtn').addEventListener('click', async () => {
  if (!confirm('This clears every entry, including your logged history. Continue?')) return;
  for (const e of entries) {
    await deleteEntryRequest(e.id);
  }
  await refresh();
});

refresh();
</script>
</body>
</html>
